glue = "0.2"
kind = "table"
description = "The exact infinite XX chain (Delta = 0), from free fermions. CSV with long column names."

[source]
locator = "glob"
root = "../data/exact"
pattern = "xx_h{h}.csv"
constants = { Delta = 0.0 }

[source.reader]
format = "csv"
rename = { temperature = "T", energy = "E", heat_capacity = "C", magnetization = "M", susceptibility = "chi" }

[field]
inputs = ["Delta", "h", "T"]
outputs = ["E", "C", "M", "chi"]
axis = "T"

[columns.T]
unit = "J"
label = "temperature"

[columns.E]
unit = "J"
label = "energy per site"
