glue = "0.2"
kind = "table"
description = "Lattice QMC energies with error bars, stored in SQLite by inverse temperature"

[source]
locator = "sqlite"
file = "../data/qmc.db"
query = "SELECT u AS U, j AS J, n, 1.0 / beta AS T, energy AS E, energy_err AS dE FROM runs"

[field]
inputs = ["U", "J", "n", "T"]
outputs = ["E"]
axis = "T"

[columns.T]
unit = "t"
label = "temperature"

[columns.E]
unit = "t"
label = "energy per site"
error = "dE"
