glue = "0.1"
kind = "table"
description = "DMFT energy per site vs temperature"

[source]
locator = "glob"
root = "../data/dmft"
pattern = "U_{U}/J_{J}/n_{n}.dat"

[source.reader]
format = "text"
columns = ["T", "E"]

[curves]
x = "T"

[columns.T]
unit = "t"
label = "temperature"

[columns.E]
unit = "t"
label = "energy per site"
