[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glue-data"
version = "0.2.0"
description = "Describe, combine, and plot scientific data spread across many files"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
hdf5 = ["h5py>=3.8"]
test = ["pytest>=7", "pyarrow>=12", "h5py>=3.8"]

[project.scripts]
glue = "glue.cli:main"

[tool.setuptools]
packages = ["glue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
